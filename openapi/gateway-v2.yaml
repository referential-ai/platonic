{
  "components": {
    "parameters": {
      "IdempotencyKey": {
        "description": "1-128 UTF-8 bytes with no whitespace or control characters. The durable namespace is the stable principal, API major, operation, exact path IDs, and RFC 8785 request-body hash.",
        "example": "01J5Z9Y7Z8Y4VQG9G6H3M2K1PT",
        "in": "header",
        "name": "Idempotency-Key",
        "required": true,
        "schema": {
          "maxLength": 128,
          "minLength": 1,
          "pattern": "^\\S+$",
          "type": "string"
        }
      },
      "RunLastEventId": {
        "description": "Exact next native event offset emitted by a prior run SSE event in the same available daemon-lifetime cursor.",
        "example": 8,
        "in": "header",
        "name": "Last-Event-ID",
        "required": false,
        "schema": {
          "format": "uint64",
          "minimum": 0,
          "type": "integer"
        }
      },
      "ThreadLastEventId": {
        "description": "Exact live epoch and next native event offset emitted by a prior thread SSE event.",
        "example": "epoch_1:8",
        "in": "header",
        "name": "Last-Event-ID",
        "required": false,
        "schema": {
          "pattern": "^[^:]+:[0-9]+$",
          "type": "string"
        }
      }
    },
    "schemas": {
      "ApprovalRequest": {
        "additionalProperties": false,
        "examples": [
          {
            "decision": "grant"
          },
          {
            "decision": "deny",
            "reason": "Outside the approved scope"
          }
        ],
        "properties": {
          "decision": {
            "enum": [
              "grant",
              "deny"
            ],
            "type": "string"
          },
          "reason": {
            "maxLength": 16384,
            "type": [
              "string",
              "null"
            ]
          }
        },
        "required": [
          "decision"
        ],
        "type": "object"
      },
      "EmptyRequest": {
        "additionalProperties": false,
        "example": {},
        "maxProperties": 0,
        "type": "object"
      },
      "Error": {
        "additionalProperties": false,
        "examples": [
          {
            "error": {
              "code": "forbidden_scope",
              "message": "the requested workspace is not admitted"
            }
          },
          {
            "error": {
              "code": "idempotency_outcome_unknown",
              "message": "inspect state and use a new key"
            }
          },
          {
            "error": {
              "code": "event_cursor_unavailable",
              "message": "inspect status or transcript"
            }
          }
        ],
        "properties": {
          "error": {
            "additionalProperties": false,
            "properties": {
              "code": {
                "description": "Stable gateway code or preserved stable native error code",
                "type": "string"
              },
              "message": {
                "type": "string"
              }
            },
            "required": [
              "code",
              "message"
            ],
            "type": "object"
          }
        },
        "required": [
          "error"
        ],
        "type": "object"
      },
      "MessageRequest": {
        "additionalProperties": false,
        "example": {
          "message": "Continue with the bounded change",
          "turn_id": "turn_42"
        },
        "properties": {
          "message": {
            "maxLength": 262144,
            "minLength": 1,
            "type": "string"
          },
          "prior_interrupted_run_id": {
            "type": [
              "string",
              "null"
            ]
          },
          "turn_id": {
            "type": [
              "string",
              "null"
            ]
          }
        },
        "required": [
          "message"
        ],
        "type": "object"
      },
      "NativeOutcome": {
        "additionalProperties": true,
        "description": "The exact typed native v2 result for the mapped operation.",
        "type": "object"
      }
    },
    "securitySchemes": {
      "bearerAuth": {
        "bearerFormat": "32 random bytes encoded as base64url without padding",
        "description": "The gateway hashes bearer material with SHA-256 and compares configured canonical-home hashes in constant time. Proxy identity headers are ignored.",
        "scheme": "bearer",
        "type": "http"
      }
    }
  },
  "info": {
    "description": "A translating adapter over the native typed NDJSON v2 protocol. It is plaintext, has no CORS, cookies, browser session, proxy-header identity, or in-process TLS, and is intended to sit behind an operator-owned TLS proxy. Actor and controller identity always come from the authenticated principal.",
    "title": "Platonic authenticated HTTP gateway",
    "version": "2.0.0"
  },
  "openapi": "3.1.0",
  "paths": {
    "/v2/status": {
      "get": {
        "operationId": "getStatus",
        "parameters": [],
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/NativeOutcome"
                }
              }
            },
            "description": "Native typed outcome"
          },
          "400": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Malformed input or missing/invalid idempotency key"
          },
          "401": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Bearer authentication failed"
          },
          "403": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "The principal is outside the workspace scope"
          },
          "404": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "The route or scoped target is unavailable"
          },
          "405": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "The method is not admitted for this route"
          },
          "409": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Idempotency conflict/ambiguity or unavailable event cursor",
            "headers": {
              "Retry-After": {
                "description": "One second for idempotency_in_progress",
                "schema": {
                  "const": 1,
                  "type": "integer"
                }
              }
            }
          },
          "413": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "Request body or headers exceed a fixed ceiling"
          },
          "415": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "A JSON mutation has an unsupported content type"
          },
          "429": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "The principal request or mutation-rate ceiling is reached"
          },
          "500": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "The gateway could not serialize or persist a deterministic outcome"
          },
          "502": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "The native daemon returned an invalid or oversized outcome"
          },
          "503": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "description": "The gateway is overloaded, version-skewed, or native state is unavailable"
          }
        },
        "summary": "Read authoritative daemon status"
      }
    },
