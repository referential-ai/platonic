[package]
name = "plato-daemon-client"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
publish = ["crates-io"]
description = "Bounded daemon client and local IPC transport for Plato Agent."
license = "MIT OR Apache-2.0"
repository = "https://github.com/referential-ai/plato-agent"
documentation = "https://docs.rs/plato-daemon-client"
readme = "README.md"
include = ["src/**", "README.md"]

[dependencies]
plato-protocol = { version = "0.2.0", path = "../plato-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["event", "fs", "net", "process", "time"] }

[target.'cfg(windows)'.dependencies]
interprocess = "=2.4.2"
widestring = "1"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }

[dev-dependencies]
temp-env = "0.3"
tempfile = "3"
