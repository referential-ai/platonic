[package]
name = "plato-audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Typed local audio primitives and voice output for Plato Agent."
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/plato-audio"
readme = "README.md"
include = [
  "src/**",
  "examples/**",
  "fixtures/**",
  "README.md",
  "LICENSE-APACHE",
  "LICENSE-MIT",
]

[features]
default = []
whisper-cuda = [
  "dep:tracing",
  "dep:whisper-rs",
  "whisper-rs/cuda",
  "whisper-rs/tracing_backend",
]

[dependencies]
cpal.workspace = true
ort.workspace = true
rtrb.workspace = true
rubato.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing = { workspace = true, optional = true }
whisper-rs = { workspace = true, optional = true }

[dev-dependencies]
hound.workspace = true

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
ort = { workspace = true, features = ["cuda"] }

[[example]]
name = "kokoro_device_proof"
path = "examples/kokoro_device_proof.rs"

[[example]]
name = "barge_in_device_proof"
path = "examples/barge_in_device_proof.rs"
