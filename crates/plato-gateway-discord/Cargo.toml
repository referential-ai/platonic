[package]
name = "plato-gateway-discord"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
publish = ["crates-io"]
description = "Discord gateway runtime for Plato Agent."
license = "MIT OR Apache-2.0"
repository = "https://github.com/referential-ai/plato-agent"
documentation = "https://docs.rs/plato-gateway-discord"
readme = "README.md"
include = ["src/**", "README.md"]

[dependencies]
platonic-client = { version = "0.2.0", path = "../platonic-client" }
platonic-protocol = { version = "0.2.0", path = "../platonic-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
ureq = { version = "2", features = ["json"] }
url = "2"

[dev-dependencies]
tempfile = "3"
