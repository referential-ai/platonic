[package]
name = "plato-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Plato Agent client distribution built on Platonic."
license.workspace = true
repository.workspace = true
readme = "../../README.md"

[features]
default = []
whisper-cuda = ["plato-audio/whisper-cuda"]

[[bin]]
name = "plato"
path = "src/bin/plato.rs"

[[bin]]
name = "plato-tui"
path = "src/bin/plato-tui.rs"
doc = false

[dependencies]
clap.workspace = true
plato-audio.workspace = true
plato-tui.workspace = true
platonic-client.workspace = true
platonic-core.workspace = true
platonic-protocol.workspace = true
rusqlite.workspace = true
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
toml.workspace = true

[dev-dependencies]
hound.workspace = true
temp-env.workspace = true
tempfile.workspace = true

[target.'cfg(unix)'.dev-dependencies]
pty-process.workspace = true
vt100.workspace = true
