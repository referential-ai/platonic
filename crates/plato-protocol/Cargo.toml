[package]
name = "plato-protocol"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
publish = ["crates-io"]
description = "Sans-IO daemon wire protocol types for Plato Agent."
license = "MIT OR Apache-2.0"
repository = "https://github.com/referential-ai/plato-agent"
documentation = "https://docs.rs/plato-protocol"
readme = "README.md"
include = ["src/**", "README.md"]

[dependencies]
platonic-core = "0.3.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
