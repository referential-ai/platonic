<text x="120" y="216" textLength="780" lengthAdjust="spacingAndGlyphs" fill="#e6edf3" font-weight="400" font-style="normal" opacity="1" xml:space="preserve">This repository is a harmless, read-only target for the Plato Agent first run.</text>
