pid /tmp/nginx.pid;
worker_processes auto;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $request $status $body_bytes_sent';
    access_log /dev/stdout main;
    sendfile on;

    gzip on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/javascript application/json application/wasm application/xml image/svg+xml text/css text/plain;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    map $uri $cache_control {
        default "public, max-age=0, must-revalidate";
        ~^/_astro/ "public, max-age=31536000, immutable";
        ~^/pagefind/(fragment|index)/ "public, max-age=31536000, immutable";
        ~^/pagefind/pagefind\.[^.]+\.pf_meta$ "public, max-age=31536000, immutable";
    }

    server {
        listen 8080;
        listen [::]:8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;
        charset utf-8;
        server_tokens off;

        add_header Cache-Control $cache_control always;
        add_header Content-Security-Policy "default-src 'none'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'none'; frame-ancestors 'none'; img-src 'self' data:; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;

        error_page 404 /404.html;

        location = /404.html {
            internal;
        }

        location ~ ^/sitemap(?:-index|-\d+)?\.xml$ {
            types { application/xml xml; }
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
