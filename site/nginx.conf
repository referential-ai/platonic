pid /tmp/nginx.pid;
worker_processes auto;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    sendfile on;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        listen 8080;
        listen [::]:8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;
        charset utf-8;
        server_tokens off;

        add_header Content-Security-Policy "default-src 'self'; img-src 'self'; style-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;

        # BEGIN GENERATED DOCS REDIRECTS
        # Generated from docs-site/migration.json by site/scripts/docs-redirects.mjs.
        # Request fragments never reach nginx; #551 preserves their destination anchors.
        location = /docs {
            if ($request_uri != "$uri$is_args$args") {
                return 404;
            }
            return 308 https://docs.referential.ai/$is_args$args;
        }

        location = /docs/ {
            if ($request_uri != "$uri$is_args$args") {
                return 404;
            }
            return 308 https://docs.referential.ai/$is_args$args;
        }

        location = /docs/index.html {
            if ($request_uri != "$uri$is_args$args") {
                return 404;
            }
            return 308 https://docs.referential.ai/$is_args$args;
        }

        location = /docs/docs/QUICKSTART.html {
            if ($request_uri != "$uri$is_args$args") {
                return 404;
            }
            return 308 https://docs.referential.ai/user/install/$is_args$args;
        }

        location = /docs/docs/GATEWAY.html {
            if ($request_uri != "$uri$is_args$args") {
                return 404;
            }
            return 308 https://docs.referential.ai/user/operations/discord/$is_args$args;
        }

        location = /docs/docs/ARCHITECTURE.html {
            if ($request_uri != "$uri$is_args$args") {
                return 404;
            }
            return 308 https://docs.referential.ai/developer/$is_args$args;
        }
        # END GENERATED DOCS REDIRECTS

        location = /favicon.ico {
            access_log off;
            log_not_found off;
            return 204;
        }

        location = /feed.xml {
            types { application/atom+xml xml; }
            try_files $uri =404;
        }

        location = /sitemap.xml {
            types { application/xml xml; }
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
