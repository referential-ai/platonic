[workspace]
members = ["crates/plato-protocol"]
exclude = ["desktop/src-tauri"]
resolver = "3"

[package]
name = "plato-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = ["crates-io"]
description = "Plato Agent runtime and CLI built on the Platonic framework."
license = "MIT OR Apache-2.0"
repository = "https://github.com/referential-ai/plato-agent"
documentation = "https://docs.rs/plato-agent"
readme = "README.md"

[[bin]]
name = "plato"
path = "src/bin/plato.rs"

[[bin]]
name = "plato-agentd"
path = "src/bin/plato-agentd.rs"

[[bin]]
name = "plato-tui"
path = "src/bin/plato-tui.rs"

[[bin]]
name = "plato-gateway-discord"
path = "src/bin/plato-gateway-discord.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
crossterm = "0.28.1"
plato-protocol = { version = "0.1.0", path = "crates/plato-protocol" }
platonic-core = "0.3.0"
ratatui = { version = "0.29.0", features = ["unstable-rendered-line-info"] }
rusqlite = { version = "0.39", features = ["bundled"] }
rustix = { version = "1", features = ["event", "fs", "net", "process", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
sha2 = "0.10"
thiserror = "2"
toml = "0.9"
tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
ureq = { version = "2", features = ["json"] }
url = "2"

[target.'cfg(windows)'.dependencies]
ctrlc = "=3.5.2"
interprocess = "=2.4.2"
widestring = "1"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_WindowsProgramming",
] }

[dev-dependencies]
temp-env = "0.3"
tempfile = "3"

[target.'cfg(unix)'.dev-dependencies]
pty-process = "0.5.3"
vt100 = "0.15.2"
