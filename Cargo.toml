[workspace]
members = [
  "crates/plato-agent",
  "crates/plato-audio",
  "crates/plato-tui",
  "crates/platonic",
  "crates/platonic-client",
  "crates/platonic-protocol",
  "crates/platonic-server",
]
# desktop/src-tauri stays out of the workspace: it needs GTK/webkit system
# libraries that the fast `Rust` job deliberately does not install. CI covers
# it in the `Linux shell` job, which does install them. The gap it appears to
# leave is documentation only -- see AGENTS.md Verification.
exclude = ["desktop/src-tauri"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/referential-ai/plato-agent"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
cpal = "=0.18.1"
crossterm = "0.28.1"
ctrlc = "=3.5.2"
hound = "=3.5.1"
html2text = "0.17.1"
interprocess = "=2.4.2"
ort = "=2.0.0-rc.13"
plato-audio = { version = "0.2.0", path = "crates/plato-audio" }
plato-tui = { version = "0.2.0", path = "crates/plato-tui" }
platonic-client = { version = "0.2.0", path = "crates/platonic-client" }
platonic-core = "0.3.1"
platonic-protocol = { version = "0.2.0", path = "crates/platonic-protocol" }
platonic-server = { version = "0.2.0", path = "crates/platonic-server" }
pty-process = "0.5.3"
pulldown-cmark = { version = "0.13.4", default-features = false }
ratatui = { version = "0.29.0", features = ["unstable-backend-writer", "unstable-rendered-line-info"] }
rtrb = "=0.3.4"
rubato = "=4.0.0"
rusqlite = { version = "0.39", features = ["bundled"] }
rustix = { version = "1", features = ["event", "fs", "net", "process", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signal-hook = "0.3"
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
temp-env = "0.3"
tempfile = "3"
thiserror = "2"
toml = "0.9"
tracing = "0.1"
tui-textarea = "0.7.0"
tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.0"
ureq = { version = "2", features = ["json"] }
url = "2.5.8"
vt100 = "0.15.2"
whisper-rs = "=0.16.0"
widestring = "1"
windows-sys = "0.61"
