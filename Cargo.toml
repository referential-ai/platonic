[workspace]
members = [
  "crates/plato-audio",
  "crates/platonic-client",
  "crates/plato-gateway-discord",
  "crates/platonic-protocol",
  "crates/plato-tui",
]
# desktop/src-tauri stays out of the workspace: it needs GTK/webkit system
# libraries that the fast `Rust` job deliberately does not install. CI covers
# it in the `Linux shell` job, which does install them. The gap it appears to
# leave is documentation only -- see AGENTS.md Verification.
exclude = ["desktop/src-tauri"]
resolver = "3"

[package]
name = "plato-agent"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
publish = ["crates-io"]
description = "Plato Agent runtime and CLI built on the Platonic framework."
license = "MIT OR Apache-2.0"
repository = "https://github.com/referential-ai/plato-agent"
documentation = "https://docs.rs/plato-agent"
readme = "README.md"

[features]
default = []
whisper-cuda = ["plato-audio/whisper-cuda"]

[[bin]]
name = "plato"
path = "src/bin/plato.rs"

[[bin]]
name = "plato-agentd"
path = "src/bin/plato-agentd.rs"

[[bin]]
name = "plato-tui"
path = "src/bin/plato-tui.rs"
doc = false

[[bin]]
name = "plato-gateway-discord"
path = "src/bin/plato-gateway-discord.rs"
doc = false

[dependencies]
clap = { version = "4", features = ["derive"] }
html2text = "0.17.1"
plato-audio = { version = "0.2.0", path = "crates/plato-audio" }
platonic-client = { version = "0.2.0", path = "crates/platonic-client" }
plato-gateway-discord = { version = "0.2.0", path = "crates/plato-gateway-discord" }
platonic-protocol = { version = "0.2.0", path = "crates/platonic-protocol" }
plato-tui = { version = "0.2.0", path = "crates/plato-tui" }
platonic-core = "0.3.1"
rusqlite = { version = "0.39", features = ["bundled"] }
rustix = { version = "1", features = ["event", "fs", "net", "process", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
sha2 = "0.10"
thiserror = "2"
toml = "0.9"
ureq = { version = "2", features = ["json"] }
url = "2.5.8"

[target.'cfg(windows)'.dependencies]
ctrlc = "=3.5.2"
interprocess = "=2.4.2"
widestring = "1"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_WindowsProgramming",
] }

[dev-dependencies]
hound = "=3.5.1"
temp-env = "0.3"
tempfile = "3"

[target.'cfg(unix)'.dev-dependencies]
pty-process = "0.5.3"
vt100 = "0.15.2"
