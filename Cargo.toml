[package]
name = "platonic-core"
version = "0.3.1"
edition = "2024"
rust-version = "1.85"
publish = ["crates-io"]
description = "Core Rust harness primitives for disciplined, replayable agent execution."
license = "MIT OR Apache-2.0"
repository = "https://github.com/referential-ai/platonic-core"
documentation = "https://docs.rs/platonic-core"
include = [
    "src/**",
    "examples/**",
    "README.md",
    "CHANGELOG.md",
    "LICENSE-*",
]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
