[package]
name = "plato-desktop"
version = "0.2.0"
description = "Plato Agent desktop shell"
license = "MIT OR Apache-2.0"
edition = "2024"
rust-version = "1.88"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "plato_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
platonic-client = { version = "0.2.0", path = "../../crates/platonic-client" }
platonic-protocol = { version = "0.2.0", path = "../../crates/platonic-protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-dialog = "2.7.1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

[dev-dependencies]
tempfile = "3"
