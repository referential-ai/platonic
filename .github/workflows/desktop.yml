name: Desktop CI

on:
  pull_request:
  push:
    branches:
      - main
      - release/**

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: 1.88.0

jobs:
  rustsec:
    name: Desktop RustSec
    runs-on: ubuntu-24.04
    steps:
      - name: Check out plato-agent
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install Rust 1.88.0
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.0

      - name: Audit desktop Rust dependencies
        run: cargo audit --file desktop/src-tauri/Cargo.lock

  web:
    name: Web
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Check out plato-agent
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Prove checkout credentials are absent
        run: |
          if git config --local --get-regexp '^http\..*\.extraheader$' >/dev/null 2>&1; then
            echo "checkout credentials remain" >&2
            exit 1
          else
            status=$?
            test "$status" -eq 1 || exit "$status"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Check desktop exports and dependencies
        run: npx --yes knip@6.32.1 --config knip.json

      - name: Check site exports and dependencies
        working-directory: site
        run: npx --yes knip@6.32.1 --config knip.json

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check types
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build web UI
        run: npm run build

  linux-shell:
    name: Linux shell
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Check out plato-agent
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install Rust 1.88.0
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-on-failure: true
          workspaces: |
            . -> target
            desktop/src-tauri -> ../../target

      - name: Fetch locked Rust dependencies
        run: |
          cargo fetch --manifest-path ../Cargo.toml --locked
          cargo fetch --manifest-path src-tauri/Cargo.toml --locked
          ort_cache_dir="$RUNNER_TEMP/plato-ort-cache"
          ort_prime_target="$RUNNER_TEMP/plato-ort-prime-target"
          test ! -e "$ort_cache_dir"
          test ! -e "$ort_prime_target"
          mkdir -p "$ort_cache_dir" "$ort_prime_target"
          ORT_CACHE_DIR="$ort_cache_dir" \
            CARGO_TARGET_DIR="$ort_prime_target" \
            cargo check --manifest-path ../Cargo.toml --locked -p ort-sys
          mapfile -t ort_lib_dirs < <(
            find "$ort_cache_dir/dfbin" -type f -name 'libonnxruntime.a' \
              -printf '%h\n' | LC_ALL=C sort -u
          )
          test "${#ort_lib_dirs[@]}" -eq 1
          printf '%s\n' \
            "ORT_CACHE_DIR=$ort_cache_dir" \
            "ORT_LIB_PATH=${ort_lib_dirs[0]}" \
            'CARGO_NET_OFFLINE=true' >> "$GITHUB_ENV"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libayatana-appindicator3-dev \
            libasound2-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Run desktop Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Prove Unix sidecar lifecycle
        env:
          PLATO_APPIMAGE_PROOF_KEY: appimage-proof-dummy
        run: |
          cargo build --manifest-path ../Cargo.toml --locked --bin platonic
          PLATO_APPIMAGE_TEST_DAEMON="$CARGO_TARGET_DIR/debug/platonic" \
            cargo test --manifest-path src-tauri/Cargo.toml --locked \
              unix_proof::provisioned_unix_sidecar_lifecycle -- \
              --ignored --exact --nocapture --test-threads=1

      - name: Run Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings

      - name: Compile Linux desktop shell without bundling
        run: npm run tauri:build -- --ci -- --locked
