name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.88.0
    steps:
      - name: Check out plato-agent
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install Rust 1.88.0
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy

      - name: Install Rust 1.85.0
        run: rustup toolchain install 1.85.0 --profile minimal --component clippy

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-on-failure: true

      - name: Fetch locked Rust dependencies
        run: |
          cargo fetch --locked
          echo 'CARGO_NET_OFFLINE=true' >> "$GITHUB_ENV"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Prove plato-protocol on Rust 1.85.0
        run: |
          cargo +1.85.0 check --locked -p plato-protocol --all-targets
          cargo +1.85.0 test --locked -p plato-protocol
          cargo +1.85.0 clippy --locked -p plato-protocol --all-targets -- -D warnings
          RUSTDOCFLAGS="-D warnings" cargo +1.85.0 doc --locked -p plato-protocol --no-deps
          cargo +1.85.0 package --locked -p plato-protocol
          cargo +1.85.0 package --locked --list -p plato-protocol

      - name: Prove plato-daemon-client on Rust 1.85.0
        run: |
          cargo +1.85.0 check --locked -p plato-daemon-client --all-targets
          cargo +1.85.0 test --locked -p plato-daemon-client
          cargo +1.85.0 clippy --locked -p plato-daemon-client --all-targets -- -D warnings
          RUSTDOCFLAGS="-D warnings" cargo +1.85.0 doc --locked -p plato-daemon-client --no-deps
          cargo +1.85.0 package --locked --list -p plato-daemon-client
          package_log=$(mktemp)
          if cargo +1.85.0 package --locked --no-verify -p plato-daemon-client >"$package_log" 2>&1; then
            cat "$package_log"
          else
            cat "$package_log"
            grep -F 'no matching package named `plato-protocol` found' "$package_log"
          fi

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Run clippy
        run: cargo clippy --workspace --locked --all-targets -- -D warnings

      - name: Check documentation
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --locked --no-deps

      - name: Check command help
        run: |
          cargo run --locked -p plato-agent --bin plato -- --help
          cargo run --locked -p plato-agent --bin plato-agentd -- --help
          cargo run --locked -p plato-agent --bin plato-tui -- --help
          cargo run --locked -p plato-agent --bin plato-gateway-discord -- --help
