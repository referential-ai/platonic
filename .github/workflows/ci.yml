name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.88.0
    steps:
      - name: Check out plato-agent
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install Rust 1.88.0
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy
          rustup toolchain install 1.85.0 --profile minimal

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-on-failure: true

      - name: Install Linux audio build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: Fetch locked Rust dependencies
        run: |
          cargo fetch --locked
          ort_cache_dir="$RUNNER_TEMP/plato-ort-cache"
          ort_prime_target="$RUNNER_TEMP/plato-ort-prime-target"
          test ! -e "$ort_cache_dir"
          test ! -e "$ort_prime_target"
          mkdir -p "$ort_cache_dir" "$ort_prime_target"
          ORT_CACHE_DIR="$ort_cache_dir" \
            CARGO_TARGET_DIR="$ort_prime_target" \
            cargo check --locked -p ort-sys
          mapfile -t ort_lib_dirs < <(
            find "$ort_cache_dir/dfbin" -type f -name 'libonnxruntime.a' \
              -printf '%h\n' | LC_ALL=C sort -u
          )
          test "${#ort_lib_dirs[@]}" -eq 1
          printf '%s\n' \
            "ORT_CACHE_DIR=$ort_cache_dir" \
            "ORT_LIB_PATH=${ort_lib_dirs[0]}" \
            'CARGO_NET_OFFLINE=true' >> "$GITHUB_ENV"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check release identity and bundle contracts
        run: ./scripts/test-release.sh

      - name: Check platonic-core MSRV
        run: cargo +1.85.0 check --locked -p platonic-core

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Run clippy
        run: cargo clippy --workspace --locked --all-targets -- -D warnings

      - name: Check documentation
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --locked --no-deps

      - name: Package platonic-core
        run: cargo package --locked -p platonic-core

      - name: Check command help
        run: |
          cargo run --locked -p plato-agent --bin plato -- --help
          cargo run --locked -p plato-agent --bin plato-tui -- --help
          cargo run --locked -p platonic --bin platonic -- --help

  macos:
    name: macOS
    runs-on: macos-15
    env:
      RUSTUP_TOOLCHAIN: 1.88.0
    steps:
      - name: Check out plato-agent
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install Rust 1.88.0
        run: rustup toolchain install 1.88.0 --profile minimal --component clippy

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-on-failure: true

      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked

      # P026 makes macOS a supported server platform and #167 boards DMG
      # distribution, but nothing has ever compiled it. This is the first gate.
      #
      # Four TestDaemon bin tests hang on macOS after bind succeeds and are
      # ignored on this platform only, tracked as #462. timeout-minutes stays
      # on every step so any future hang fails loudly in bounded time instead
      # of burning the six-hour job limit in silence.
      # Compile gate only. Twelve first-day runs proved the unit and
      # integration fixtures carry real-time deadlines (audio capture,
      # websocket waits, web-tool bounds) that flake nondeterministically on
      # shared macOS runners -- a different test per run. Test EXECUTION on
      # macOS is #465's charter on stable hardware; this gate proves the
      # whole workspace, every test binary included, compiles and lints for
      # the platform. The deterministic divergences found on the way are
      # ignored in-tree with their issues named (#462/#463/#464/#465).
      - name: Build everything
        timeout-minutes: 45
        env:
          TMPDIR: ${{ runner.temp }}
        run: cargo build --workspace --locked --all-targets

      - name: Run clippy
        timeout-minutes: 30
        run: cargo clippy --workspace --locked --all-targets -- -D warnings
