name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.88.0
    steps:
      - name: Check out plato-agent
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install Rust 1.88.0
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy

      - name: Install Rust 1.85.0
        run: rustup toolchain install 1.85.0 --profile minimal --component clippy

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-on-failure: true

      - name: Install Linux audio build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: Fetch locked Rust dependencies
        run: |
          cargo fetch --locked
          ort_cache_dir="$RUNNER_TEMP/plato-ort-cache"
          ort_prime_target="$RUNNER_TEMP/plato-ort-prime-target"
          test ! -e "$ort_cache_dir"
          test ! -e "$ort_prime_target"
          mkdir -p "$ort_cache_dir" "$ort_prime_target"
          ORT_CACHE_DIR="$ort_cache_dir" \
            CARGO_TARGET_DIR="$ort_prime_target" \
            cargo check --locked -p ort-sys
          mapfile -t ort_lib_dirs < <(
            find "$ort_cache_dir/dfbin" -type f -name 'libonnxruntime.a' \
              -printf '%h\n' | LC_ALL=C sort -u
          )
          test "${#ort_lib_dirs[@]}" -eq 1
          printf '%s\n' \
            "ORT_CACHE_DIR=$ort_cache_dir" \
            "ORT_LIB_PATH=${ort_lib_dirs[0]}" \
            'CARGO_NET_OFFLINE=true' >> "$GITHUB_ENV"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Prove platonic-protocol on Rust 1.85.0
        run: |
          cargo +1.85.0 check --locked -p platonic-protocol --all-targets
          cargo +1.85.0 test --locked -p platonic-protocol
          cargo +1.85.0 clippy --locked -p platonic-protocol --all-targets -- -D warnings
          RUSTDOCFLAGS="-D warnings" cargo +1.85.0 doc --locked -p platonic-protocol --no-deps
          cargo +1.85.0 package --locked -p platonic-protocol
          cargo +1.85.0 package --locked --list -p platonic-protocol

      - name: Prove platonic-client on Rust 1.85.0
        run: |
          cargo +1.85.0 check --locked -p platonic-client --all-targets
          cargo +1.85.0 test --locked -p platonic-client
          cargo +1.85.0 clippy --locked -p platonic-client --all-targets -- -D warnings
          RUSTDOCFLAGS="-D warnings" cargo +1.85.0 doc --locked -p platonic-client --no-deps
          cargo +1.85.0 package --locked --list -p platonic-client
          package_log=$(mktemp)
          if cargo +1.85.0 package --locked --no-verify -p platonic-client >"$package_log" 2>&1; then
            cat "$package_log"
          else
            cat "$package_log"
            grep -F 'no matching package named `platonic-protocol` found' "$package_log"
          fi

      - name: Prove plato-tui on Rust 1.88.0
        run: |
          cargo check --locked -p plato-tui --all-targets
          cargo test --locked -p plato-tui
          cargo clippy --locked -p plato-tui --all-targets -- -D warnings
          RUSTDOCFLAGS="-D warnings" cargo doc --locked -p plato-tui --no-deps
          cargo package --locked --list -p plato-tui
          package_log=$(mktemp)
          if cargo package --locked --no-verify -p plato-tui >"$package_log" 2>&1; then
            cat "$package_log"
          else
            cat "$package_log"
            grep -F 'no matching package named `platonic-client` found' "$package_log"
          fi

      - name: Prove plato-gateway-discord on Rust 1.88.0
        run: |
          cargo check --locked -p plato-gateway-discord --all-targets
          cargo test --locked -p plato-gateway-discord
          cargo clippy --locked -p plato-gateway-discord --all-targets -- -D warnings
          RUSTDOCFLAGS="-D warnings" cargo doc --locked -p plato-gateway-discord --no-deps
          cargo package --locked --list -p plato-gateway-discord
          package_log=$(mktemp)
          if cargo package --locked --no-verify -p plato-gateway-discord >"$package_log" 2>&1; then
            cat "$package_log"
          else
            cat "$package_log"
            grep -F 'no matching package named `platonic-client` found' "$package_log"
          fi

      - name: Prove plato-audio on Rust 1.88.0
        run: |
          cargo check --locked -p plato-audio --all-targets
          cargo test --locked -p plato-audio
          cargo clippy --locked -p plato-audio --all-targets -- -D warnings
          RUSTDOCFLAGS="-D warnings" cargo doc --locked -p plato-audio --no-deps
          cargo package --locked -p plato-audio
          cargo package --locked --list -p plato-audio

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Run clippy
        run: cargo clippy --workspace --locked --all-targets -- -D warnings

      - name: Check documentation
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --locked --no-deps

      - name: Check command help
        run: |
          cargo run --locked -p plato-agent --bin plato -- --help
          cargo run --locked -p plato-agent --bin plato-agentd -- --help
          cargo run --locked -p plato-agent --bin plato-tui -- --help
          cargo run --locked -p plato-agent --bin plato-gateway-discord -- --help

  macos:
    name: macOS
    runs-on: macos-15
    env:
      RUSTUP_TOOLCHAIN: 1.88.0
    steps:
      - name: Check out plato-agent
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install Rust 1.88.0
        run: rustup toolchain install 1.88.0 --profile minimal --component clippy

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-on-failure: true

      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked

      # P026 makes macOS a supported server platform and #167 boards DMG
      # distribution, but nothing has ever compiled it. This is the first gate.
      #
      # Four TestDaemon bin tests hang on macOS after bind succeeds and are
      # ignored on this platform only, tracked as #462. timeout-minutes stays
      # on every step so any future hang fails loudly in bounded time instead
      # of burning the six-hour job limit in silence.
      - name: Run tests
        timeout-minutes: 45
        run: cargo test --workspace --locked

      - name: Run clippy
        timeout-minutes: 30
        run: cargo clippy --workspace --locked --all-targets -- -D warnings
