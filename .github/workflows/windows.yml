name: Windows CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  daemon:
    name: Windows daemon
    runs-on: windows-2025
    env:
      RUST_BACKTRACE: "1"
      RUSTUP_TOOLCHAIN: 1.88.0
    steps:
      - name: Check out plato-agent
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install Rust 1.88.0
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-on-failure: true

      - name: Fetch locked Rust dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          cargo fetch --locked
          $ortCacheDir = Join-Path $env:RUNNER_TEMP "plato-ort-cache"
          $ortPrimeTarget = Join-Path $env:RUNNER_TEMP "plato-ort-prime-target"
          if ((Test-Path $ortCacheDir) -or (Test-Path $ortPrimeTarget)) {
            throw "ORT prime cache and target must start empty"
          }
          New-Item -ItemType Directory -Path $ortCacheDir, $ortPrimeTarget | Out-Null
          $normalTargetDir = $env:CARGO_TARGET_DIR
          $env:ORT_CACHE_DIR = $ortCacheDir
          $env:CARGO_TARGET_DIR = $ortPrimeTarget
          cargo check --locked -p ort-sys
          $env:CARGO_TARGET_DIR = $normalTargetDir
          $ortLibDirs = @(
            Get-ChildItem -Path (Join-Path $ortCacheDir "dfbin") -Recurse -File -Filter "onnxruntime.lib" |
              ForEach-Object { $_.Directory.FullName } |
              Sort-Object -Unique
          )
          if ($ortLibDirs.Count -ne 1) {
            throw "expected exactly one ONNX Runtime library directory; found $($ortLibDirs.Count)"
          }
          "ORT_CACHE_DIR=$ortCacheDir" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ORT_LIB_PATH=$($ortLibDirs[0])" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS=-l dxguid -l DXCORE -l DXGI -l D3D12 -l DirectML" |
            Out-File -FilePath $env:GITHUB_ENV -Append
          "CARGO_NET_OFFLINE=true" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Create ACL proof user
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $user = "plato-acl-test"
          $password = "P1pe147!Aa2"
          Write-Output "::add-mask::$password"
          net user $user /delete 2>$null | Out-Null
          net user $user $password /add | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "failed to create second local user" }
          "PLATO_WINDOWS_SECOND_USER=$user" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PLATO_WINDOWS_SECOND_PASSWORD=$password" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Check formatting
        run: cargo fmt --check

      - name: Check native Windows audio targets
        run: cargo check --locked -p plato-audio --all-targets

      - name: Run Windows tests
        run: cargo test --workspace --locked

      - name: Prove installer startup gate
        run: >-
          cargo test --locked --test windows_daemon
          installer_gate_refuses_daemon_before_endpoint_or_lock_creation
          -- --ignored --exact --nocapture

      - name: Prove current-user installer gate isolation
        run: >-
          cargo test --locked --test windows_daemon
          installer_gate_is_isolated_per_current_user
          -- --ignored --exact --nocapture

      - name: Prove independent daemon installer-gate release
        run: >-
          cargo test --locked --test sqlite_cli_lock
          independent_daemon_startups_wait_for_installer_gate_release
          -- --exact --nocapture

      - name: Prove pipe and lock ACLs
        run: >-
          cargo test --locked --test windows_daemon
          production_pipe_and_lock_reject_second_user_and_remote_clients
          -- --ignored --exact --nocapture

      - name: Prove hostile pipe pre-bind rejection
        run: >-
          cargo test --locked --test windows_daemon
          client_rejects_second_user_prebound_pipes
          -- --ignored --exact --nocapture

      - name: Prove Ctrl-C graceful shutdown
        run: >-
          cargo test --locked --test windows_daemon
          ctrl_c_stops_daemon_and_removes_lock
          -- --ignored --exact --nocapture

      - name: Prove installer daemon control
        run: >-
          cargo test --locked --test windows_daemon
          installer_control_preflights_refuses_active_and_retries_after_terminal
          -- --ignored --exact --nocapture

      - name: Run Windows clippy
        run: cargo clippy --workspace --locked --all-targets -- -D warnings

      - name: Remove ACL proof user
        if: always()
        shell: pwsh
        run: |
          net user plato-acl-test /delete 2>$null | Out-Null
          exit 0
