name: Docs Pages

on:
  pull_request:
    branches:
      - develop
    paths:
      - README.md
      - docs/QUICKSTART.md
      - docs/GATEWAY.md
      - docs/ARCHITECTURE.md
      - docs/book/**
      - book.toml
      - .github/workflows/docs-pages.yml
  push:
    branches:
      - develop
    paths:
      - README.md
      - docs/QUICKSTART.md
      - docs/GATEWAY.md
      - docs/ARCHITECTURE.md
      - docs/book/**
      - book.toml
      - .github/workflows/docs-pages.yml

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build mdBook
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out Platonic
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mdBook 0.5.4
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/mdbook.tar.gz"
          install_dir="$RUNNER_TEMP/mdbook"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz \
            --output "$archive"
          printf '%s  %s\n' \
            '3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7' \
            "$archive" | sha256sum --check
          mkdir "$install_dir"
          tar -xzf "$archive" -C "$install_dir"
          "$install_dir/mdbook" --version
          printf '%s\n' "$install_dir" >> "$GITHUB_PATH"

      - name: Build and verify the book
        run: |
          set -euo pipefail
          mdbook build 2>&1 | tee "$RUNNER_TEMP/mdbook-build.log"
          if grep -Eiq '(^|[^[:alnum:]_])warn(ing)?([^[:alnum:]_]|$)' \
            "$RUNNER_TEMP/mdbook-build.log"; then
            exit 1
          fi
          sed -i 's|href="../README.html|href="../index.html|g' \
            target/mdbook/docs/QUICKSTART.html \
            target/mdbook/docs/GATEWAY.html
          test -f target/mdbook/index.html
          test -f target/mdbook/docs/QUICKSTART.html
          test -f target/mdbook/docs/GATEWAY.html
          test -f target/mdbook/docs/ARCHITECTURE.html
          grep -Fq '<base href="/platonic/">' target/mdbook/404.html
          if grep -Eq '(href|src)="/' \
            target/mdbook/index.html target/mdbook/docs/*.html; then
            exit 1
          fi
          grep -Fq 'href="docs/QUICKSTART.html"' target/mdbook/index.html
          grep -Fq 'href="../index.html#configuration"' \
            target/mdbook/docs/GATEWAY.html
          grep -Fq 'href="QUICKSTART.html#0-one-time-setup"' \
            target/mdbook/docs/GATEWAY.html
          grep -Fq 'href="../docs/GATEWAY.html"' \
            target/mdbook/docs/QUICKSTART.html
          grep -Fq 'href="../docs/ARCHITECTURE.html"' \
            target/mdbook/docs/GATEWAY.html

      - name: Upload GitHub Pages artifact
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/mdbook

  deploy:
    name: Deploy GitHub Pages
    if: ${{ github.event_name == 'push' }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
